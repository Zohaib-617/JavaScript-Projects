<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
     <div class="container2">
        <header>
            <h1 class="orange">Weather Explorer</h1>
            <p>Stay updated with the latest weather conditions</p>
        </header>

        <div class="searchdiv">
            <input type="text" placeholder="Enter country or Region">
            <button class="search">Search</button>
        </div>

        <div class="informationdiv">
            <div class="imgdiv">
                <img class="icon" src="//cdn.weatherapi.com/weather/64x64/day/113.png" alt="">
            </div>
           <div>
             <h1 class="orange city">Calabar</h1>
        <h4 class="temperature">Temperature: 11.02C</h4>
        <h4 class="condition">clear sky</h4>
           </div>
        </div>

        <div class="cards">

            <div class="card">
                <h1 class="orange">wind speed</h1>
                <p class="cardinfo card1"></p>
            </div>

            <div class="card">
                <h1 class="orange">wind direction</h1>
             <p class="cardinfo card2"></p>
          </div>

            <div class="card">
                <h1 class="orange">Humidity</h1>
                <p class="cardinfo card3"></p>
            </div>

        </div>

     </div>
   </div>

    <script src="script.js"></script>
</body>
</html>
