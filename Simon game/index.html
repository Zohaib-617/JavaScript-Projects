<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <div class="circle">
  
        <div id="box1" class="innerdiv ">red</div>
        <div id="box2" class="innerdiv ">green</div>
        <div id="box3" class="innerdiv ">blue</div>
        <div id="box4" class="innerdiv ">yellow</div>
    </div>
    <button class="start-btn">Start</button>
<div class="input-button">
    <div class="inputdiv">
        <p class="input-storage"></p>
    <button class="add-btn">Remove</button>
    </div>
    <div class="buttondiv">
        <button class="compare-btn">Compare</button>
    </div>

    <h3 class="result-heading">Enter Sequence... </h3>
</div>

    <script src="script.js"></script>
</body>
</html>
